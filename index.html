<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vila 11</title>

  <!-- PWA / iOS home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vila 11" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 32px);
      gap: 0;
    }

    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .icon-wrap {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(99,102,241,0.35);
    }

    .icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title-group {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.5;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px 24px;
      background: var(--accent);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    }

    .btn:active {
      background: var(--accent-light);
      transform: scale(0.98);
    }

    .btn svg {
      flex-shrink: 0;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }

    /* Spinner shown while auto-redirecting */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .btn.loading .btn-label { display: none; }
    .btn.loading .spinner { display: block; }
    .btn.loading svg { display: none; }

    .footer {
      position: fixed;
      bottom: max(env(safe-area-inset-bottom), 16px);
      font-size: 12px;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="icon-192.png" alt="Vila 11" />
    </div>

    <div class="title-group">
      <h1>Vila 11</h1>
      <p class="subtitle">Portal do morador</p>
    </div>

    <a id="portalBtn" class="btn" href="https://vila11.my.site.com/tenant/s/" target="_top">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
        <polyline points="10 17 15 12 10 7"/>
        <line x1="15" y1="12" x2="3" y2="12"/>
      </svg>
      <span class="btn-label">Acessar portal</span>
      <div class="spinner"></div>
    </a>

    <p class="hint" id="hint">
      Toque para entrar. Após o primeiro login, você permanece conectado.
    </p>
  </div>

  <p class="footer">Vila 11 · Portal do morador</p>

  <script>
    const TARGET = "https://vila11.my.site.com/tenant/s/";
    const btn = document.getElementById("portalBtn");
    const hint = document.getElementById("hint");

    // If opened standalone (from home screen), auto-redirect after a brief moment
    const isStandalone =
      window.navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;

    if (isStandalone) {
      hint.textContent = "Redirecionando…";
      btn.classList.add("loading");
      setTimeout(() => { window.location.href = TARGET; }, 800);
    }

    btn.addEventListener("click", (e) => {
      btn.classList.add("loading");
    });
  </script>
</body>
</html>
